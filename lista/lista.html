<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi lista de tareas · Proyecto 2</title>
    <link rel="stylesheet" href="lista.css">
  </head>
  <body>
    <header class="nav-app">
      <a href="../index.html">← Mi página personal</a>
      <a href="../practica-js.html">Laboratorio JS</a>
    </header>

    <main class="app-tareas">
      <h1>📝 Mi lista de tareas</h1>
      <p id="resumen" class="resumen"></p>

      <form id="form-tarea" class="form-tarea" novalidate>
        <input type="text" id="input-tarea" placeholder="Nueva tarea…" aria-label="Nueva tarea" autocomplete="off">
        <button type="submit">Agregar</button>
      </form>

      <p id="mensaje-error" class="mensaje-error"></p>

      <ul id="lista-tareas" class="lista-tareas"></ul>

      <div class="acciones">
        <button type="button" id="btn-limpiar" class="btn-limpiar">🧹 Borrar completadas</button>
      </div>

      <p class="pie">Proyecto 2 · Programación Web Básica</p>
    </main>

    <script src="lista.js"></script>
  </body>
</html>
